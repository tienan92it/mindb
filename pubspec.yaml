name: mindb
description: AI-powered PostgreSQL client with terminal-like UI.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  drift: ^2.22.1
  drift_flutter: ^0.2.4
  path_provider: ^2.1.5
  flutter_riverpod: ^2.6.1
  go_router: ^16.1.0
  google_fonts: ^6.3.0
  logger: ^2.7.0
  http: ^1.6.0
  postgres: ^3.4.8
  flutter_secure_storage: ^10.2.0
  shared_preferences: ^2.5.3
  uuid: ^4.5.3
  intl: ^0.20.2
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.22.1
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  image_path: assets/branding/mindb-logo-square.png
  android: true
  ios: true
  macos:
    generate: true
  web:
    generate: true
    background_color: "#0D0D0D"
    theme_color: "#2DD4BF"
  windows:
    generate: true
    icon_size: 256
  adaptive_icon_background: "#0D0D0D"
  adaptive_icon_foreground: assets/branding/mindb-logo-square.png

flutter:
  uses-material-design: true
  assets:
    - assets/branding/

name: Bug
description: Report incorrect behavior or crash
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: App version / commit
      placeholder: e.g. 1.0.0+1 or git sha

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Connection / Postgres
        - Schema / AI tools
        - Session / transcript UI
        - Settings / LLM providers
        - iOS / platform
        - Other

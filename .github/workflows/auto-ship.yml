name: Deliver auto-ship

on:
  check_suite:
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  merge-when-green:
    if: github.event.check_suite.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Merge PRs labeled ready-ship when checks pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPO="${{ github.repository }}"
          PRS=$(gh pr list --repo "$REPO" --state open --label ready-ship --json number,headRefOid --jq '.[] | select(.headRefOid == "'"${{ github.event.check_suite.head_sha }}"'") | .number')
          for pr in $PRS; do
            [ -z "$pr" ] && continue
            echo "Auto-merging feature PR #$pr"
            gh pr merge "$pr" --repo "$REPO" --squash --delete-branch || true
            ISSUE=$(gh pr view "$pr" --repo "$REPO" --json body --jq '.body' | grep -oE 'Fixes #[0-9]+' | head -1 | tr -d 'Fixes #')
            if [ -n "$ISSUE" ]; then
              gh issue edit "$ISSUE" --repo "$REPO" --remove-label building,in-review --add-label shipped 2>/dev/null || true
              gh issue close "$ISSUE" --repo "$REPO" --comment "Delivered via PR #$pr" 2>/dev/null || true
              bash .github/scripts/merge-docs-for-issue.sh "$ISSUE" "$REPO"
            fi
          done
